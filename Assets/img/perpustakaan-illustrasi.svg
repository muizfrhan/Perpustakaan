<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 900" width="900" height="900" role="img" aria-label="Ilustrasi interior perpustakaan modern: rak buku tinggi, meja baca, lampu hangat, dan pengunjung yang membaca">
  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#080d24"/>
      <stop offset="0.42" stop-color="#101743"/>
      <stop offset="1" stop-color="#1b1147"/>
    </linearGradient>
    <linearGradient id="floorG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b1030"/>
      <stop offset="1" stop-color="#05081a"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0" stop-color="#0e3a63"/>
      <stop offset="0.55" stop-color="#1b2a6e"/>
      <stop offset="1" stop-color="#3a2a72"/>
    </linearGradient>
    <linearGradient id="shaft" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7dd3fc" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#7dd3fc" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="bulbCone" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fcd34d" stop-opacity="0.34"/>
      <stop offset="1" stop-color="#f59e0b" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="shelfSide" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2b3364"/>
      <stop offset="1" stop-color="#1b2049"/>
    </linearGradient>
    <linearGradient id="deskTop" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a4488"/>
      <stop offset="1" stop-color="#232a5c"/>
    </linearGradient>
    <radialGradient id="glowTL" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#4f46e5" stop-opacity="0.40"/>
      <stop offset="1" stop-color="#4f46e5" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowTR" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="winHalo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#38bdf8" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="poolCyan" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#38bdf8" stop-opacity="0.24"/>
      <stop offset="1" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="poolAmber" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fbbf24" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#fbbf24" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="bulbGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fde68a" stop-opacity="0.75"/>
      <stop offset="0.45" stop-color="#fbbf24" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>
    <filter id="dof" x="-12%" y="-12%" width="124%" height="124%">
      <feGaussianBlur stdDeviation="1.4"/>
    </filter>
    <pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#ffffff" fill-opacity="0.07"/>
    </pattern>
  </defs>

  <!-- ============ DINDING & SUASANA ============ -->
  <rect width="900" height="900" fill="url(#wall)"/>
  <ellipse cx="90" cy="70" rx="430" ry="380" fill="url(#glowTL)"/>
  <ellipse cx="792" cy="180" rx="330" ry="300" fill="url(#glowTR)"/>
  <rect width="900" height="900" fill="url(#dots)"/>

  <!-- Siluet rak buku jauh di kiri: hanya petunjuk kedalaman, tetap tenang. -->
  <g filter="url(#dof)" opacity="0.5">
    <rect x="54" y="300" width="232" height="348" fill="#ffffff" fill-opacity="0.035"/>
    <g fill="#ffffff" fill-opacity="0.05">
      <rect x="54" y="374" width="232" height="5"/>
      <rect x="54" y="448" width="232" height="5"/>
      <rect x="54" y="522" width="232" height="5"/>
      <rect x="54" y="596" width="232" height="5"/>
    </g>
  </g>

