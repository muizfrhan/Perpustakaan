      <rect x="416" y="544" width="12" height="86" rx="2" fill="#6366f1"/>
      <rect x="430" y="538" width="16" height="92" rx="2" fill="#f59e0b"/>
      <rect x="448" y="554" width="10" height="76" rx="2" fill="#22d3ee"/>
      <rect x="460" y="540" width="18" height="90" rx="2" fill="#4f46e5"/>
      <rect x="480" y="548" width="14" height="82" rx="2" fill="#e2e8f0"/>
      <rect x="496" y="534" width="20" height="96" rx="2" fill="#8b5cf6"/>
      <rect x="518" y="546" width="12" height="84" rx="2" fill="#38bdf8"/>
      <rect x="532" y="542" width="16" height="88" rx="2" fill="#a78bfa"/>
      <rect x="550" y="552" width="12" height="78" rx="2" fill="#fcd34d"/>
      <rect x="564" y="538" width="18" height="92" rx="2" fill="#4f46e5"/>
      <rect x="584" y="550" width="14" height="80" rx="2" fill="#cbd5e1"/>
      <rect x="600" y="544" width="16" height="86" rx="2" fill="#22d3ee"/>
      <rect x="618" y="556" width="10" height="74" rx="2" fill="#fbbf24"/>
    </g>
    <rect x="408" y="630" width="228" height="6" fill="#38427e"/>
  </g>

  <!-- Tanaman di atas rak -->
  <g>
    <path d="M604 140h32l-5-26h-22z" fill="#2a3160"/>
    <g fill="#10b981" fill-opacity="0.85">
      <path d="M620 114c-16-6-22-22-18-38 16 4 22 20 18 38z"/>
      <path d="M620 114c14-8 18-24 12-40-15 6-19 22-12 40z"/>
      <path d="M620 114c-2-16 6-30 20-36 2 16-6 30-20 36z"/>
    </g>
  </g>

  <!-- ============ PENGUNJUNG MEMBACA (mid-ground, sedikit blur) ============ -->
