    <rect x="396" y="152" width="12" height="496" fill="url(#shelfSide)"/>
    <rect x="636" y="152" width="12" height="496" fill="#171c40"/>
    <rect x="408" y="152" width="228" height="486" fill="#0d1230"/>

    <!-- Buku baris 1 -->
    <g>
      <rect x="416" y="174" width="16" height="96" rx="2" fill="#4f46e5"/>
      <rect x="434" y="186" width="12" height="84" rx="2" fill="#6366f1"/>
      <rect x="448" y="178" width="18" height="92" rx="2" fill="#22d3ee"/>
      <rect x="468" y="192" width="10" height="78" rx="2" fill="#a78bfa"/>
      <rect x="480" y="182" width="14" height="88" rx="2" fill="#f59e0b"/>
      <rect x="496" y="172" width="20" height="98" rx="2" fill="#e2e8f0"/>
      <rect x="518" y="188" width="12" height="82" rx="2" fill="#8b5cf6"/>
