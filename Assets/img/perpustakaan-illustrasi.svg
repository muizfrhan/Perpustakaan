    <circle cx="812" cy="416" r="1.8" fill-opacity="0.26"/>
    <circle cx="782" cy="300" r="2" fill-opacity="0.22"/>
    <circle cx="700" cy="430" r="1.6" fill-opacity="0.28"/>
  </g>
  <!-- Berkas cahaya turun ke lantai -->
