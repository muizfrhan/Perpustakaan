      <rect x="518" y="306" width="14" height="84" rx="2" fill="#f59e0b"/>
      <rect x="534" y="300" width="12" height="90" rx="2" fill="#22d3ee"/>
      <rect x="548" y="310" width="16" height="80" rx="2" fill="#a78bfa"/>
      <rect x="566" y="314" width="10" height="76" rx="2" fill="#cbd5e1"/>
      <rect x="578" y="298" width="18" height="92" rx="2" fill="#4f46e5"/>
      <rect x="598" y="304" width="14" height="86" rx="2" fill="#fbbf24"/>
      <rect x="614" y="312" width="12" height="78" rx="2" fill="#38bdf8"/>
