    <path d="M726 540c10-10 32-12 44 0" stroke="#5b6bb8" stroke-width="2" stroke-opacity="0.45" fill="none" stroke-linecap="round"/>
    <path d="M714 594c6 26 22 42 44 50" stroke="#0b1030" stroke-width="14" fill="none" stroke-linecap="round"/>
    <path d="M702 640c0-34 6-52 22-60" stroke="#5b6bb8" stroke-width="2" stroke-opacity="0.4" fill="none" stroke-linecap="round"/>
    <path d="M744 636h48l-4 12h-48z" fill="#e2e8f0" fill-opacity="0.88"/>
  </g>

  <!-- Tanaman lantai -->
