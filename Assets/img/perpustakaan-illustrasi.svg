    <ellipse cx="512" cy="648" rx="46" ry="9" fill="#000000" fill-opacity="0.35"/>
    <path d="M494 648c-2-40 2-70 6-92l24 2c5 24 8 52 6 90z" fill="#0a0e26"/>
    <circle cx="512" cy="536" r="21" fill="#0a0e26"/>
    <path d="M506 596c14 6 26 4 34-6" stroke="#0a0e26" stroke-width="12" fill="none" stroke-linecap="round"/>
    <path d="M492 566l40 6-3 26-41-6z" fill="#151a3d" stroke="#5b6bb8" stroke-width="1.4" stroke-opacity="0.5"/>
    <path d="M492 566v26" stroke="#5b6bb8" stroke-width="1.4" stroke-opacity="0.5"/>
  </g>

  <!-- ============ MEJA BACA ============ -->
  <g>
    <rect x="596" y="686" width="296" height="12" rx="4" fill="url(#deskTop)"/>
    <rect x="596" y="686" width="296" height="3" fill="#4d59a8" fill-opacity="0.7"/>
    <rect x="614" y="698" width="10" height="88" rx="3" fill="#1c2248"/>
    <rect x="864" y="698" width="10" height="88" rx="3" fill="#1c2248"/>
    <rect x="700" y="700" width="88" height="7" rx="3" fill="#161b3c"/>

    <!-- Buku terbuka di meja -->
    <path d="M648 686c14-10 30-10 42-2v-9c-12-8-28-8-42 2z" fill="#e2e8f0" fill-opacity="0.92"/>
    <path d="M690 684c12-8 28-8 42 2v-9c-14-10-30-10-42-2z" fill="#cbd5e1" fill-opacity="0.92"/>
    <path d="M690 675v9" stroke="#94a3b8" stroke-width="1.6" stroke-opacity="0.7"/>

    <!-- Lampu meja -->
    <ellipse cx="812" cy="682" rx="17" ry="5" fill="#1c2248"/>
    <rect x="809" y="620" width="5" height="62" rx="2" fill="#3a4488"/>
    <path d="M811 622l26-20" stroke="#3a4488" stroke-width="5" stroke-linecap="round"/>
    <path d="M822 588h34l-8 24h-18z" fill="#fcd34d"/>
    <path d="M822 588h34l-2 6h-30z" fill="#fef3c7" fill-opacity="0.85"/>
    <circle cx="839" cy="608" r="56" fill="url(#bulbGlow)"/>
    <path d="M824 612h20l30 74h-80z" fill="url(#bulbCone)"/>
  </g>

  <!-- Kursi + pengunjung yang membaca (foreground) -->
  <g>
    <ellipse cx="740" cy="792" rx="72" ry="12" fill="#000000" fill-opacity="0.4"/>
    <rect x="684" y="592" width="11" height="62" rx="5" fill="#171c40"/>
    <rect x="690" y="646" width="82" height="11" rx="5" fill="#232a5c"/>
    <rect x="700" y="657" width="8" height="34" rx="3" fill="#171c40"/>
    <rect x="754" y="657" width="8" height="34" rx="3" fill="#171c40"/>

    <path d="M700 646c-2-40 6-62 26-70h44c22 8 28 30 26 70z" fill="#0b1030"/>
