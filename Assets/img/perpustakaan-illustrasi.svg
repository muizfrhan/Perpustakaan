    <path d="M770 132v338"/>
    <path d="M664 300h212"/>
    <path d="M664 392h212"/>
    <path d="M702 176a74 74 0 0 1 136 0"/>
  </g>
  <path d="M686 244a84 84 0 0 1 96-70 200 200 0 0 0-96 152z" fill="#bae6fd" fill-opacity="0.16"/>
