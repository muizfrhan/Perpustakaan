    <ellipse cx="866" cy="812" rx="44" ry="9" fill="#000000" fill-opacity="0.4"/>
    <path d="M846 812h40l-6-46h-28z" fill="#2a3160"/>
    <g fill="#10b981" fill-opacity="0.8">
