  <rect x="0" y="648" width="900" height="252" fill="url(#floorG)"/>
  <rect x="0" y="647" width="900" height="2" fill="#8ea2ff" fill-opacity="0.16"/>
  <ellipse cx="778" cy="704" rx="176" ry="40" fill="url(#poolCyan)"/>
  <ellipse cx="812" cy="768" rx="150" ry="36" fill="url(#poolAmber)"/>

